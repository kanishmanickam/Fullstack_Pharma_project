version: '3.8'
services:
  mongodb:
    image: mongo:6.0
    container_name: medistock-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: medistock
    volumes:
      - mongodb_data:/data/db
    networks:
      - medistock-network

networks:
  medistock-network:
    driver: bridge

volumes:
  mongodb_data:
