version: '3.8'
services:
  mongodb:
    image: mongo:6.0
    container_name: medistock-mongodb
    ports:
      - "127.0.0.1:27017:27017" # Restricts access to localhost only
    environment:
      # Strictly sourced from .env file
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: medistock
    volumes:
      - mongodb_data:/data/db
    networks:
      - medistock-network

networks:
  medistock-network:
    driver: bridge

volumes:
  mongodb_data:
